<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="800" height="600" rx="20" fill="url(#paint0_linear)" />
  
  <!-- Recruitment workflow elements -->
  <g opacity="0.9">
    <!-- Define section -->
    <circle cx="200" cy="150" r="50" fill="#4F46E5" opacity="0.8" />
    <text x="200" y="155" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">Define</text>
    
    <!-- Source section -->
    <circle cx="350" cy="150" r="50" fill="#8B5CF6" opacity="0.8" />
    <text x="350" y="155" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">Source</text>
    
    <!-- Review section -->
    <circle cx="500" cy="150" r="50" fill="#EC4899" opacity="0.8" />
    <text x="500" y="155" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">Review</text>
    
    <!-- Reach section -->
    <circle cx="200" cy="300" r="50" fill="#F59E0B" opacity="0.8" />
    <text x="200" y="305" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">Reach</text>
    
    <!-- Assess section -->
    <circle cx="350" cy="300" r="50" fill="#10B981" opacity="0.8" />
    <text x="350" y="305" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">Assess</text>
    
    <!-- Submit section -->
    <circle cx="500" cy="300" r="50" fill="#3B82F6" opacity="0.8" />
    <text x="500" y="305" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">Submit</text>
    
    <!-- Connecting lines -->
    <line x1="250" y1="150" x2="300" y2="150" stroke="white" stroke-width="2" />
    <line x1="400" y1="150" x2="450" y2="150" stroke="white" stroke-width="2" />
    <line x1="500" y1="200" x2="500" y2="250" stroke="white" stroke-width="2" />
    <line x1="450" y1="300" x2="400" y2="300" stroke="white" stroke-width="2" />
    <line x1="300" y1="300" x2="250" y2="300" stroke="white" stroke-width="2" />
    <line x1="200" y1="250" x2="200" y2="200" stroke="white" stroke-width="2" />
    
    <!-- Document icons -->
    <rect x="150" y="400" r="5" width="100" height="130" rx="5" fill="white" opacity="0.6" />
    <rect x="160" y="420" width="80" height="10" rx="2" fill="#4F46E5" opacity="0.8" />
    <rect x="160" y="440" width="60" height="10" rx="2" fill="#4F46E5" opacity="0.8" />
    <rect x="160" y="460" width="70" height="10" rx="2" fill="#4F46E5" opacity="0.8" />
    
    <!-- Profile icons -->
    <rect x="350" y="400" r="5" width="100" height="130" rx="5" fill="white" opacity="0.6" />
    <circle cx="400" cy="440" r="20" fill="#8B5CF6" opacity="0.8" />
    <rect x="370" y="470" width="60" height="10" rx="2" fill="#8B5CF6" opacity="0.8" />
    <rect x="370" y="490" width="40" height="10" rx="2" fill="#8B5CF6" opacity="0.8" />
    
    <!-- Email icons -->
    <rect x="550" y="400" r="5" width="100" height="130" rx="5" fill="white" opacity="0.6" />
    <rect x="560" y="420" width="80" height="10" rx="2" fill="#10B981" opacity="0.8" />
    <rect x="560" y="440" width="80" height="40" rx="2" fill="#10B981" opacity="0.2" />
    <rect x="560" y="490" width="40" height="10" rx="2" fill="#10B981" opacity="0.8" />
  </g>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
  </defs>
</svg>
